
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08b9c4">
<meta name="description" content="Local Meet — автентичні прогулянки, місцеві гіди та незвичайні враження Україною.">
<title>Local Meet — Україна очима місцевих</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--a:#08b9c4;--orange:#ff8549;--dark:#152b44;--gray:#697a8a;--bg:#f5f9fa;--border:#e1e9ed}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Manrope,Arial,sans-serif;color:var(--dark);line-height:1.6}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{display:block;width:100%;object-fit:cover}
.wrap{max-width:1180px;width:calc(100% - 36px);margin:auto}
header{background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;min-height:76px;gap:24px}
.logo{font-size:23px;font-weight:800;letter-spacing:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:9px}
.logo b{color:var(--a)}
.logo-mark{width:39px;height:44px}
nav{display:flex;gap:23px;margin-left:auto}
nav a{font-size:13px;font-weight:800;color:#506275}
nav a:hover{color:var(--a)}
.nav-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--a);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-weight:800;transition:.2s}
.btn:hover{background:#079da7;transform:translateY(-2px)}
.btn.outline{background:white;color:var(--dark);border:1px solid var(--border)}
.btn.orange{background:var(--orange)}
.btn.full{width:100%}
.btn.sm{padding:10px 15px;font-size:12px}
.lang,.menu{border:1px solid var(--border);background:#fff;color:var(--dark);font-weight:800;padding:9px 13px;border-radius:10px}
.menu{display:none}
section{padding:75px 0}
.soft{background:var(--bg)}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(36px,5vw,63px);line-height:1.14;letter-spacing:-2.5px;margin:15px 0 23px}
h2{font-size:clamp(27px,3vw,39px);letter-spacing:-1.5px;line-height:1.25}
h3{font-size:18px;line-height:1.35;letter-spacing:-.4px}
.sub{color:var(--gray);max-width:580px}
.eyebrow{text-transform:uppercase;color:var(--a);font-size:11px;letter-spacing:2px;font-weight:800}
.hero{padding:0;background:#edf6f7}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}
.hero-copy{padding:80px 0}
.hero h1 span{color:var(--a)}
.hero-image{height:590px;position:relative}
.hero-image img{height:100%;border-radius:0 0 0 95px}
.float{position:absolute;bottom:40px;left:-35px;background:white;box-shadow:0 15px 40px #142b452a;border-radius:15px;padding:18px 22px;font-size:13px;font-weight:800}
.search{display:flex;gap:7px;background:white;padding:7px;border:1px solid var(--border);border-radius:15px;margin-top:27px;box-shadow:0 12px 32px #142b4510}
.search input,.search select{padding:13px 10px;min-width:0;border:0;outline:0;background:white;color:var(--dark)}
.search input{flex:1}
.search select{max-width:145px;border-right:1px solid var(--border)}
.search button{white-space:nowrap}
.stats{display:flex;gap:32px;margin-top:30px}
.stats strong{font-size:23px;display:block}
.stats small{font-size:12px;color:var(--gray)}
.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:30px}
.heading p{color:var(--gray);margin-bottom:0}
.link{color:var(--a);font-weight:800;font-size:13px}
.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}
.category{padding:22px 10px;border:1px solid var(--border);border-radius:18px;background:#fff;text-align:center;font-weight:800;color:var(--dark)}
.category:hover{border-color:var(--a);background:#ebfafa}
.category .emoji{display:block;font-size:33px;margin-bottom:9px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px}
.card{background:white;border:1px solid var(--border);border-radius:19px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 15px 35px #142b4513}
.card-img{height:218px;position:relative;overflow:hidden}
.card-img img{height:100%}
.tag{display:inline-block;background:#e4f7f8;color:#078f99;border-radius:25px;padding:5px 11px;font-size:11px;font-weight:800}
.card-img .tag{position:absolute;top:13px;left:13px;background:#fff}
.heart{position:absolute;top:12px;right:12px;width:38px;height:38px;border:0;background:white;border-radius:50%;font-size:24px;color:#9dabba;line-height:1}
.heart.active{color:#f0627d}
.card-body{padding:19px}
.meta{font-size:12px;color:var(--gray);font-weight:700}
.card h3{margin:9px 0 11px;min-height:48px}
.card h3 a:hover{color:var(--a)}
.rating{color:#d59424;font-size:12px;font-weight:800}
.rating span{color:var(--gray);font-weight:500}
.card-bottom{display:flex;align-items:end;justify-content:space-between;gap:7px;border-top:1px solid var(--border);padding-top:15px;margin-top:16px}
.price strong{font-size:22px}
.price small{display:block;font-size:11px;color:var(--gray)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.step{border:1px solid var(--border);border-radius:19px;padding:28px}
.number{width:45px;height:45px;display:grid;place-items:center;background:#e4f8f9;color:#0798a2;font-size:18px;font-weight:800;border-radius:12px;margin-bottom:21px}
.step p{color:var(--gray)}
.banner{background:var(--dark);border-radius:24px;color:#fff;padding:45px;display:flex;justify-content:space-between;align-items:center;gap:22px}
.banner p{color:#cad7df}
.page-title{background:var(--bg);padding:65px 0 45px}
.page-title h1{font-size:43px;letter-spacing:-1.5px;margin-bottom:12px}
.notice{font-size:12px;color:#36737b;background:#e8f8f9;border:1px solid #d2eff0;padding:12px 16px;border-radius:12px;margin-bottom:22px}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.input{background:#fff;color:var(--dark);border:1px solid #d9e4ea;padding:12px 15px;border-radius:12px;outline:none;min-width:0;width:100%}
.input:focus{border-color:var(--a)}
.filters .input{flex:1;min-width:160px}
.filters select{max-width:200px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.pill{background:white;border:1px solid var(--border);border-radius:25px;padding:9px 15px;font-size:12px;font-weight:800;color:var(--dark)}
.pill.selected{background:var(--dark);color:white}
.count{color:var(--gray);font-size:13px;margin-bottom:22px}
.empty{text-align:center;grid-column:1/-1;padding:70px 20px;border:1px dashed var(--border);border-radius:20px;color:var(--gray)}
.empty h3{color:var(--dark)}
.detail-layout{display:grid;grid-template-columns:1.65fr .85fr;gap:35px}
.detail-picture{height:400px;border-radius:20px}
.description{padding:30px 0}
.description p{color:var(--gray)}
.box{border:1px solid var(--border);border-radius:20px;padding:25px}
.side{position:sticky;top:100px;align-self:start;box-shadow:0 10px 25px #142b450b}
.side-price{font-size:30px;font-weight:800}
.checklist{display:grid;gap:12px;margin:22px 0;color:#526476;font-size:13px}
.checklist span:before{content:"✓";color:var(--a);font-weight:800;margin-right:10px}
.guide-info{display:flex;align-items:center;gap:12px;margin:20px 0}
.avatar{width:65px;height:65px;border-radius:50%;object-fit:cover}
.guide-info small{display:block;color:var(--gray)}
.guide-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.guide-card{background:white;border:1px solid var(--border);border-radius:19px;padding:25px}
.guide-card .avatar{width:84px;height:84px;margin-bottom:14px}
.guide-card p{color:var(--gray);font-size:13px;min-height:65px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:start}
.two img.feature-image{height:420px;border-radius:20px}
.form-box{border:1px solid var(--border);padding:30px;border-radius:20px}
.form-group{margin-bottom:17px}
.form-group label{font-size:12px;font-weight:800;display:block;margin-bottom:7px}
.form-group textarea{min-height:120px;resize:vertical}
.feature{padding:25px;border:1px solid var(--border);border-radius:18px}
.feature span{font-size:30px}
.feature p{color:var(--gray)}
footer{background:#11273e;color:white;padding:55px 0 25px}
.footer-grid{display:grid;grid-template-columns:1.8fr 1fr 1fr;gap:38px}
footer p,footer small{font-size:12px;color:#b7c9d4}
footer a:not(.logo){display:block;font-size:12px;color:#c5d1de;margin:9px 0}
footer a:hover{color:var(--a)}
.copyright{border-top:1px solid #33475b;margin-top:40px;padding-top:20px;font-size:12px;color:#c6d2dc}
.credit{font-size:11px;color:#aabac9;margin-top:12px}
.credit a{display:inline!important;text-decoration:underline}
.modal-bg{position:fixed;inset:0;background:#10243ad0;z-index:50;display:grid;place-items:center;padding:16px}
.modal{width:min(500px,100%);max-height:95vh;overflow:auto;background:white;border-radius:22px;padding:30px;position:relative}
.close{position:absolute;right:15px;top:12px;background:#f0f4f6;border:0;border-radius:50%;width:36px;height:36px;font-size:22px}
.success{text-align:center;padding:20px 0}
.success .symbol{font-size:52px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--dark);color:white;padding:13px 20px;border-radius:12px;z-index:70;font-size:13px}
.photo-credit{font-size:11px;color:var(--gray);margin-top:8px}
.photo-credit a{text-decoration:underline}
@media(max-width:950px){
nav{gap:12px}
nav a{font-size:11px}
.cards,.guide-cards{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:720px){
.nav{min-height:68px}
.logo{font-size:19px}
.menu{display:block}
.nav-actions .join-btn{display:none}
nav{display:none;position:absolute;top:68px;left:0;right:0;background:white;padding:20px;flex-direction:column;box-shadow:0 15px 25px #142b4515}
nav.open{display:flex}
nav a{font-size:14px}
.nav-actions{margin-left:auto}
section{padding:53px 0}
.hero-grid{grid-template-columns:1fr;gap:0}
.hero-copy{padding:55px 0 25px}
.hero-image{height:280px}
.hero-image img{border-radius:20px 20px 0 0}
.float{left:12px;bottom:15px}
.search{flex-wrap:wrap}
.search select{max-width:100%;width:100%;border-right:0;border-bottom:1px solid var(--border)}
.stats{gap:20px}
.heading{align-items:start;flex-direction:column}
.cards,.guide-cards,.steps,.two,.detail-layout{grid-template-columns:1fr}
.categories{grid-template-columns:repeat(2,1fr)}
.banner{align-items:start;flex-direction:column;padding:28px}
.filters select{max-width:none}
.detail-picture{height:260px}
.side{position:static}
.footer-grid{grid-template-columns:1fr 1fr}
.footer-grid>div:first-child{grid-column:1/-1}
.page-title h1{font-size:33px}
}
</style>
</head>

function getFiltered(){
let result=tours.filter(t=>{
const search=state.search.toLocaleLowerCase().trim();
return (state.city==="all"||t.city===state.city)
&&(state.category==="all"||t.cat===state.category)
&&(!search||`${title(t)} ${desc(t)} ${city(t.city)}`.toLocaleLowerCase().includes(search));
});
if(state.sort==="cheap")result.sort((a,b)=>a.price-b.price);
if(state.sort==="expensive")result.sort((a,b)=>b.price-a.price);
return result;
}

function refreshCatalog(){
const container=document.getElementById("catalog-results");
if(!container)return;
const result=getFiltered();
container.innerHTML=result.length?result.map(card).join(""):
`<div class="empty"><h3>${T("empty")}</h3><p>${T("emptyText")}</p></div>`;
document.getElementById("result-count").textContent=`${T("results")}: ${result.length}`;
}

<button class="btn" data-close>${T("close")}</button>
</div>`:`
<span class="eyebrow">LOCAL MEET</span>
<h2>${T("booking")}</h2>
<p class="sub">${title(t)} · ${city(t.city)}</p>
<form id="booking-form">
<div class="form-group">
<label>${T("date")}</label>
<input class="input" type="date" name="date" min="${localDate()}" required>
</div>
<div class="form-group">
<label>${T("participants")}</label>
<select class="input" id="participants" name="participants">
${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n}</option>`).join("")}
</select>
</div>
<div class="card-bottom" style="margin-bottom:20px">
<strong>${T("total")}</strong>
<strong id="booking-price">${price(t.price)}</strong>
</div>
<button class="btn full" type="submit">${T("book")}</button>
<p class="sub" style="font-size:12px;margin-top:15px">${T("bookingNote")}</p>
</form>`}
</div></div>`;
}

function saveState(){
try{
localStorage.setItem("lm_lang",state.lang);
localStorage.setItem("lm_favorites",JSON.stringify(state.favorites));
}catch(e){}
}

function render(){
document.documentElement.lang=state.lang;
const parts=(location.hash.replace(/^#\/?/,"")||"home").split("/");
let content="";
switch(parts[0]){
case "home":content=home();break;
case "catalog":content=catalog();break;
case "experience":content=detail(parts[1]);break;
case "guides":content=guidePage();break;
case "about":content=aboutPage();break;
case "favorites":content=favoritesPage();break;
case "join":content=joinPage();break;
default:content=home();
}
document.getElementById("root").innerHTML=header()+`<main>${content}</main>`+footer();
document.getElementById("modal-root").innerHTML=modalHTML();
document.body.style.overflow=state.modal?"hidden":"";
refreshCatalog();
}

function toast(message){
const root=document.getElementById("toast-root");
root.innerHTML=`<div class="toast">${escapeHTML(message)}</div>`;
clearTimeout(window.toastTimer);
window.toastTimer=setTimeout(()=>root.innerHTML="",2400);
}

function closeModal(){
state.modal=null;
state.bookingDone=false;
render();
}

document.addEventListener("click",e=>{
if(e.target.closest("#language")){
state.lang=state.lang==="uk"?"en":"uk";
saveState();render();return;
}
if(e.target.closest("#menu")){
document.getElementById("navigation").classList.toggle("open");
return;
}
const heart=e.target.closest("[data-fav]");
if(heart){
e.preventDefault();
const id=Number(heart.dataset.fav);
const index=state.favorites.indexOf(id);
if(index>=0){
state.favorites.splice(index,1);
toast(T("removed"));
}else{
state.favorites.push(id);
toast(T("saved"));
}
saveState();render();return;
}
const tile=e.target.closest("[data-category-tile]");
if(tile){
state.category=tile.dataset.categoryTile;
state.city="all";
state.search="";
location.hash="#/catalog";
render();return;
}
const pill=e.target.closest("[data-filter-category]");
if(pill){
state.category=pill.dataset.filterCategory;
document.querySelectorAll("[data-filter-category]").forEach(b=>{
b.classList.toggle("selected",b.dataset.filterCategory===state.category);
});
refreshCatalog();return;
}
const guideLink=e.target.closest("[data-guide-city]");
if(guideLink){
state.city=guideLink.dataset.guideCity;
state.category="all";
state.search="";
return;
}
const booking=e.target.closest("[data-book]");
if(booking){
state.modal="booking";
state.modalTour=Number(booking.dataset.book);
state.bookingDone=false;
render();return;
}
if(e.target.closest("[data-close]")||e.target.id==="overlay"){
closeModal();return;
}
});

document.addEventListener("input",e=>{
if(e.target.id==="filter-search"){
state.search=e.target.value;
refreshCatalog();
}
if(e.target.id==="participants"){
const t=tours.find(x=>x.id===state.modalTour);
const output=document.getElementById("booking-price");
if(t&&output)output.textContent=price(t.price*Number(e.target.value));
}
});

document.addEventListener("change",e=>{
if(e.target.id==="filter-city"){
state.city=e.target.value;
refreshCatalog();
}
if(e.target.id==="filter-sort"){
state.sort=e.target.value;
refreshCatalog();
}
});

document.addEventListener("submit",e=>{
if(e.target.id==="hero-search"){
e.preventDefault();
const data=new FormData(e.target);
state.city=String(data.get("city")||"all");
state.search=String(data.get("search")||"");
state.category="all";
location.hash="#/catalog";
render();
return;
}
if(e.target.id==="booking-form"){
e.preventDefault();
const data=new FormData(e.target);
const date=String(data.get("date")||"");
const people=Number(data.get("participants"));
if(!date||date<localDate()||people<1||people>6)return;
state.bookingDone=true;
render();return;
}
if(e.target.id==="guide-form"){
e.preventDefault();
if(!e.target.reportValidity())return;
state.modal="application";
render();return;
}
});

window.addEventListener("hashchange",()=>{
state.modal=null;
render();
window.scrollTo(0,0);
});

document.addEventListener("keydown",e=>{
if(e.key==="Escape"&&state.modal)closeModal();
});

render();
</script>
</body>
</html>
